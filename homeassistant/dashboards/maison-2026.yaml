  radio_station_card:
    show_label: true
    show_icon: true
    show_name: true
    triggers_update:
      - media_player.salon
      - media_player.cuisine
      - input_text.radio_active
    variables:
      station_name: ""
      stream_url: ""
      station_icon: "mdi:radio"
      station_desc: ""
    name: "[[[ return variables.station_name; ]]]"
    icon: "[[[ return variables.station_icon; ]]]"
    label: >-
      [[[
        const st = states['input_text.radio_active']?.state || '';
        const sp1 = states['media_player.salon']?.state;
        const sp2 = states['media_player.cuisine']?.state;
        const isPlaying = (sp1 === 'playing' || sp2 === 'playing');
        const mTitle = (states['media_player.salon']?.attributes?.media_title || states['media_player.cuisine']?.attributes?.media_title || '').toLowerCase();
        const mChannel = (states['media_player.salon']?.attributes?.media_channel || states['media_player.cuisine']?.attributes?.media_channel || '').toLowerCase();
        const target = (variables.station_name || '').toLowerCase();
        const active = isPlaying && (st === variables.station_name || (target && (mTitle.includes(target) || mChannel.includes(target))));
        if (active) {
          return 'â ¶ En lecture â ¢ Salon + Cuisine';
        }
        return variables.station_desc;
      ]]]
    tap_action:
      action: call-service
      service: script.lancer_musique_en_bas
      data:
        query: "[[[ return variables.stream_url; ]]]"
        media_type: "radio_stream"
        station: "[[[ return variables.station_name; ]]]"
    grid_options:
      columns: 6
      rows: 2
    styles:
      card:
        - min-height: 104px
        - padding: 14px 18px
        - border-radius: 20px
        - backdrop-filter: blur(14px)
        - -webkit-backdrop-filter: blur(14px)
        - transition: all 0.3s ease
        - cursor: pointer
        - background: >-
            [[[
              const st = states['input_text.radio_active']?.state || '';
              const sp1 = states['media_player.salon']?.state;
              const sp2 = states['media_player.cuisine']?.state;
              const isPlaying = (sp1 === 'playing' || sp2 === 'playing');
              const mTitle = (states['media_player.salon']?.attributes?.media_title || states['media_player.cuisine']?.attributes?.media_title || '').toLowerCase();
              const mChannel = (states['media_player.salon']?.attributes?.media_channel || states['media_player.cuisine']?.attributes?.media_channel || '').toLowerCase();
              const target = (variables.station_name || '').toLowerCase();
              const active = isPlaying && (st === variables.station_name || (target && (mTitle.includes(target) || mChannel.includes(target))));
              return active
                ? 'linear-gradient(135deg, rgba(6, 78, 59, 0.95), rgba(16, 185, 129, 0.82))'
                : 'rgba(4, 18, 38, 0.82)';
            ]]]
        - border: >-
            [[[
              const st = states['input_text.radio_active']?.state || '';
              const sp1 = states['media_player.salon']?.state;
              const sp2 = states['media_player.cuisine']?.state;
              const isPlaying = (sp1 === 'playing' || sp2 === 'playing');
              const mTitle = (states['media_player.salon']?.attributes?.media_title || states['media_player.cuisine']?.attributes?.media_title || '').toLowerCase();
              const mChannel = (states['media_player.salon']?.attributes?.media_channel || states['media_player.cuisine']?.attributes?.media_channel || '').toLowerCase();
              const target = (variables.station_name || '').toLowerCase();
              const active = isPlaying && (st === variables.station_name || (target && (mTitle.includes(target) || mChannel.includes(target))));
              return active
                ? '1.5px solid #31ffbe'
                : '1px solid rgba(59, 130, 246, 0.5)';
            ]]]
        - box-shadow: >-
            [[[
              const st = states['input_text.radio_active']?.state || '';
              const sp1 = states['media_player.salon']?.state;
              const sp2 = states['media_player.cuisine']?.state;
