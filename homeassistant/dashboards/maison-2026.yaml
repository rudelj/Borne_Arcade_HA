views:
  - title: Accueil
    path: accueil
    icon: mdi:home
    type: sections
    max_columns: 2
    dense_section_placement: true
    background: center / cover no-repeat fixed url('/local/maison-2026/background.png')
    sections:
      # SECTION 1: SURPLUS SOLAIRE & APPAREILS Ã NERGIE
      - type: grid
        cards:
          - type: custom:button-card
            name: Maison 2026
            label: >-
              [[[ return new Intl.DateTimeFormat('fr-FR', {
                weekday: 'long', day: '2-digit', month: 'long',
                hour: '2-digit', minute: '2-digit'
              }).format(new Date()) ; ]]]
            show_icon: false
            show_label: true
            update_timer: 1min
            tap_action:
              action: none
            hold_action:
              action: none
            grid_options:
              columns: 12
              rows: 2
            styles:
              card:
                - background: linear-gradient(135deg, rgba(3, 18, 40, 0.9), rgba(5, 39, 70, 0.68))
                - border: 1px solid rgba(44, 225, 255, 0.42)
                - border-radius: 24px
                - box-shadow: 0 16px 42px rgba(0, 0, 0, 0.36), inset 0 1px 0 rgba(255, 255, 255, 0.06)
                - backdrop-filter: blur(16px)
                - -webkit-backdrop-filter: blur(16px)
                - padding: 18px 24px
                - box-sizing: border-box
                - height: 100%
              grid:
                - grid-template-areas: '"n" "l"'
                - grid-template-columns: 1fr
                - grid-template-rows: min-content min-content
                - row-gap: 5px
              name:
                - justify-self: start
                - color: '#ffffff'
                - font-size: clamp(26px, 3.5vw, 38px)
                - font-weight: 800
                - letter-spacing: -0.04em
                - text-shadow: 0 0 24px rgba(44, 225, 255, 0.22)
              label:
                - justify-self: start
                - color: '#2ce1ff'
                - font-size: 13.5px
                - font-weight: 600
                - text-transform: capitalize
                - letter-spacing: 0.02em

          # SURPLUS SOLAIRE XXL
          - type: custom:button-card
            entity: sensor.surplus_solaire
            name: Surplus Solaire
            icon: mdi:solar-power-variant
            show_icon: true
            show_name: true
            show_state: true
            show_label: true
            triggers_update:
              - sensor.surplus_solaire
              - sensor.production_solaire
            tap_action:
              action: more-info
            state_display: >-
              [[[
                const val = parseFloat(entity.state) || 0;
                if (val > 0) return val + ' W';
                return '0 W';
              ]]]
            label: >-
              [[[
                const val = parseFloat(entity.state) || 0;
                const prod = states['sensor.production_solaire']?.state || '0';
                if (val > 1500) return '●  Surplus fort (> 1500 W) · Auto-conso recommandée · Prod : ' + prod + ' W';
                if (val > 0) return '●  Surplus modéré · Auto-conso partielle · Prod : ' + prod + ' W';
                return 'Réseau soutiré · Prod actuelle : ' + prod + ' W';
              ]]]
            grid_options:
              columns: 12
              rows: 2
            styles:
              card:
                - min-height: 110px
                - height: 100%
                - box-sizing: border-box
                - padding: 16px 22px
                - background: >-
                    [[[
                      const val = parseFloat(entity.state) || 0;
                      if (val > 1500) return 'linear-gradient(135deg, rgba(3, 46, 52, 0.94), rgba(4, 32, 48, 0.82))';
                      if (val > 0) return 'linear-gradient(135deg, rgba(44, 26, 8, 0.9), rgba(58, 36, 12, 0.78))';
                      return 'linear-gradient(135deg, rgba(42, 14, 28, 0.9), rgba(58, 20, 38, 0.78))';
                    ]]]
                - border: >-
                    [[[
                      const val = parseFloat(entity.state) || 0;
                      if (val > 1500) return '1.5px solid #31ffbe';
                      if (val > 0) return '1.5px solid #ffc247';
                      return '1.5px solid #ff4d6d';
                    ]]]
                - border-radius: 22px
                - box-shadow: >-
                    [[[
                      const val = parseFloat(entity.state) || 0;
                      if (val > 1500) return '0 0 24px rgba(49, 255, 190, 0.28), 0 12px 34px rgba(0, 0, 0, 0.32)';
                      if (val > 0) return '0 0 24px rgba(255, 194, 71, 0.28), 0 12px 34px rgba(0, 0, 0, 0.32)';
                      return '0 0 24px rgba(255, 77, 109, 0.25), 0 12px 34px rgba(0, 0, 0, 0.32)';
                    ]]]
                - backdrop-filter: blur(16px)
                - -webkit-backdrop-filter: blur(16px)
              grid:
                - grid-template-areas: '"i n" "i s" "i l"'
                - grid-template-columns: 50px 1fr
                - grid-template-rows: min-content min-content min-content
                - column-gap: 16px
                - row-gap: 2px
              icon:
                - width: 40px
                - color: >-
                    [[[
                      const val = parseFloat(entity.state) || 0;
                      if (val > 1500) return '#31ffbe';
                      if (val > 0) return '#ffc247';
                      return '#ff4d6d';
                    ]]]
                - filter: >-
                    [[[
                      const val = parseFloat(entity.state) || 0;
                      if (val > 1500) return 'drop-shadow(0 0 10px rgba(49, 255, 190, 0.6))';
                      if (val > 0) return 'drop-shadow(0 0 10px rgba(255, 194, 71, 0.6))';
                      return 'drop-shadow(0 0 10px rgba(255, 77, 109, 0.6))';
                    ]]]
              img_cell:
                - width: 50px
                - height: 50px
                - border-radius: 16px
                - background: >-
                    [[[
                      const val = parseFloat(entity.state) || 0;
                      if (val > 1500) return 'rgba(49, 255, 190, 0.14)';
                      if (val > 0) return 'rgba(255, 194, 71, 0.14)';
                      return 'rgba(255, 77, 109, 0.14)';
                    ]]]
                - border: >-
                    [[[
                      const val = parseFloat(entity.state) || 0;
                      if (val > 1500) return '1px solid rgba(49, 255, 190, 0.35)';
                      if (val > 0) return '1px solid rgba(255, 194, 71, 0.35)';
                      return '1px solid rgba(255, 77, 109, 0.35)';
                    ]]]
              name:
                - justify-self: start
                - color: '#ffffff'
                - font-size: 14px
                - font-weight: 700
                - text-transform: uppercase
                - letter-spacing: 0.06em
              state:
                - justify-self: start
                - color: >-
                    [[[
                      const val = parseFloat(entity.state) || 0;
                      if (val > 1500) return '#31ffbe';
                      if (val > 0) return '#ffc247';
                      return '#ff4d6d';
                    ]]]
                - font-size: 30px
                - font-weight: 800
                - letter-spacing: -0.02em
              label:
                - justify-self: start
                - color: >-
                    [[[
                      const val = parseFloat(entity.state) || 0;
                      if (val > 1500) return '#31ffbe';
                      if (val > 0) return '#ffc247';
                      return 'rgba(255, 255, 255, 0.6)';
                    ]]]
                - font-size: 12px
                - font-weight: 600

          # AUTOCONSOMMATION JOUR
          - type: custom:button-card
            entity: sensor.taux_autoconsommation_journalier
            name: Auto-conso Jour
            icon: mdi:solar-power
            show_icon: true
            show_name: true
            show_state: true
            show_label: true
            triggers_update:
              - sensor.taux_autoconsommation_journalier
              - sensor.production_solaire_journaliere
              - sensor.injection_reseau_journaliere
            tap_action:
              action: more-info
            state_display: >-
              [[[
                const val = parseFloat(entity.state);
                if (isNaN(val)) return '0.0 %';
                return val.toFixed(1) + ' %';
              ]]]
            label: >-
              [[[
                const auto = entity.attributes?.autoconsommation_kwh || '0';
                const prod = entity.attributes?.production_kwh || states['sensor.production_solaire_journaliere']?.state || '0';
                return auto + ' kWh / ' + prod + ' kWh';
              ]]]
            grid_options:
              columns: 6
              rows: 2
            styles:
              card:
                - min-height: 84px
                - height: 100%
                - box-sizing: border-box
                - padding: 12px 14px
                - background: rgba(4, 18, 38, 0.78)
                - border: 1.5px solid rgba(49, 255, 190, 0.35)
                - border-radius: 18px
                - box-shadow: 0 0 16px rgba(49, 255, 190, 0.15), 0 8px 20px rgba(0, 0, 0, 0.25)
                - backdrop-filter: blur(14px)
