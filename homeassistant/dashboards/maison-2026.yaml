            extra_styles: |
              .data-title{color:#bfeaff;font-size:11px;font-weight:800;border-bottom:1px solid rgba(56,189,248,.3);padding-bottom:6px}.vehicle-info{min-height:145px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px 14px;align-items:center}.vehicle-info>div{display:grid;grid-template-columns:30px 1fr;grid-template-areas:'i s' 'i b';text-align:left}.vehicle-info ha-icon{grid-area:i;color:#38bdf8;filter:drop-shadow(0 0 5px #0284c7)}.vehicle-info span{grid-area:s;color:#7899ac;font-size:8px}.vehicle-info b{grid-area:b;color:#5eeafb;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

