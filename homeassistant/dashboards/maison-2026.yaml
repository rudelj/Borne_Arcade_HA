  - title: MG5
    path: mg5
    icon: mdi:car-electric
    theme: MG5 Cockpit
    type: sections
    max_columns: 3
    dense_section_placement: false
    background: center / cover no-repeat fixed url('/local/maison-2026/background.png')
    sections:
      # COLONNE GAUCHE -------------------------------------------------------
      - type: grid
        title: Ã nergie véhicule
        cards:
          - type: custom:button-card
            template: hud_panel
            entity: sensor.parking_mg_mg5_electric_state_of_charge
            triggers_update:
              - sensor.parking_mg_mg5_electric_electric_range
              - sensor.parking_mg_mg5_electric_charging_power
              - sensor.parking_mg_mg5_electric_charging_status
            grid_options:
              columns: 12
              rows: 4
            custom_fields:
              content: |
                [[[ const state=entity?.state??'unavailable'; const unavailable=['unknown','unavailable'].includes(state); const soc=unavailable?0:Math.max(0,Math.min(100,Number(state))); const range=states['sensor.parking_mg_mg5_electric_electric_range']; const power=states['sensor.parking_mg_mg5_electric_charging_power']; const status=states['sensor.parking_mg_mg5_electric_charging_status']; return `<div class="head">BATTERIE</div><div class="battery-layout"><div class="gauge" style="--soc:${soc*3.6}deg"><div class="inner"><strong>${unavailable?'—':Math.round(soc)}</strong><span>%</span><small>Ã TAT DE CHARGE</small><ha-icon icon="mdi:lightning-bolt"></ha-icon></div></div><div class="stats"><small>AUTONOMIE</small><b>${range?.state??'—'} <em>${range?.attributes?.unit_of_measurement||'km'}</em></b><span>Estimation WLTP</span><hr><small>PUISSANCE</small><b>${power?.state??'—'} <em>${power?.attributes?.unit_of_measurement||'kW'}</em></b><span>${status?.state?.replaceAll('_',' ')||'—'}</span></div></div>`; ]]]
            extra_styles: |
              .head{color:#bfeaff;font-size:13px;font-weight:800;border-bottom:1px solid rgba(56,189,248,.35);padding-bottom:7px;text-align:center}.battery-layout{height:245px;display:grid;grid-template-columns:1fr 1fr;align-items:center;justify-items:center;gap:10px;padding:0 8px}.gauge{width:min(175px,90%);aspect-ratio:1;border-radius:50%;margin:auto;background:conic-gradient(from -35deg,#22d3ee 0deg,#2563eb calc(var(--soc)*.68),#d946ef var(--soc),rgba(30,41,59,.45) var(--soc) 360deg);padding:12px;box-shadow:0 0 18px rgba(34,211,238,.6),inset 0 0 24px rgba(217,70,239,.35)}.inner{height:100%;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;background:radial-gradient(circle,#020617 45%,#050b22 72%);border:1px solid rgba(147,197,253,.4)}.inner strong{font-size:50px;color:#fff;line-height:.8}.inner>span{font-size:22px;color:#fff;margin-top:14px}.inner small{width:100%;font-size:8px;color:#dff8ff;margin-top:-15px;text-align:center}.inner ha-icon{width:21px;color:#22d3ee;margin-top:-20px}.stats{text-align:left;width:100%;padding-left:10px}.stats small{display:block;color:#9bdcff;font-size:9px;letter-spacing:.04em}.stats b{display:block;color:#36e4f5;font-size:26px;margin:4px 0}.stats em{font-size:12px;font-style:normal}.stats span{display:block;color:#9fb6cc;font-size:9px;text-transform:capitalize}.stats hr{border:0;border-top:1px solid rgba(56,189,248,.18);margin:12px 0}

          - type: custom:button-card
            template: hud_panel
            entity: switch.parking_mg_mg5_electric_charging
            triggers_update:
              - time.parking_mg_mg5_electric_scheduled_charging_start
              - number.parking_mg_mg5_electric_target_soc
              - select.parking_mg_mg5_electric_charging_current_limit
            tap_action:
              action: toggle
              confirmation:
                text: Confirmer le démarrage ou l—arrêt de la recharge ?
            grid_options:
              columns: 12
              rows: 3
            custom_fields:
              content: |
                [[[ const active=entity?.state==='on'; const start=states['time.parking_mg_mg5_electric_scheduled_charging_start']; const target=states['number.parking_mg_mg5_electric_target_soc']; const current=states['select.parking_mg_mg5_electric_charging_current_limit']; return `<div class="head">CHARGE</div><div class="charge"><div><small>Charge programmée</small><b>${start?.state||'—'}</b><span>Tous les jours</span></div><div class="start ${active?'active':''}"><strong>${active?'ARRÃ TER':'DÃ MARRER'}</strong><span>LA CHARGE</span></div><div><small>Limite de charge</small><b>${target?.state||'—'}%</b><div class="line"><i style="width:${target?.state||0}%"></i></div><small>Courant</small><b>${current?.state||'—'}</b></div></div>`; ]]]
            extra_styles: |
              .head{color:#bfeaff;font-size:12px;font-weight:800;border-bottom:1px solid rgba(56,189,248,.35);padding-bottom:6px;text-align:center}.charge{min-height:170px;display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;justify-items:center;text-align:center;padding:0 8px}.charge>div:first-child,.charge>div:last-child{width:100%;text-align:center}.charge small,.charge span{display:block;color:#a9c1d4;font-size:9px}.charge b{display:block;color:#5eeafb;font-size:18px;margin:4px 0}.start{width:84px;aspect-ratio:1;border-radius:50%;display:flex;flex-direction:column;justify-content:center;align-items:center;border:1px solid #4ade80;color:#4ade80;box-shadow:0 0 14px rgba(74,222,128,.3)}.start.active{border-color:#fb7185;color:#fb7185;box-shadow:0 0 14px rgba(251,113,133,.3)}.start strong{font-size:10px}.start span{font-size:8px;color:inherit}.line{height:3px;background:#172554;margin:6px auto 10px;max-width:100px}.line i{display:block;height:100%;background:#22d3ee;box-shadow:0 0 8px #22d3ee}

          - type: history-graph
            title: Trajets et consommation â ¢ 24 h
            hours_to_show: 24
            entities:
              - entity: sensor.parking_mg_mg5_electric_mileage_since_last_charge
                name: Distance
