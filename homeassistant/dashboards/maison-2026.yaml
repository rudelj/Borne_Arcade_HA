        - padding: 26px
      grid:
        - grid-template-columns: 82px 1fr
        - column-gap: 20px
      icon:
        - width: 54px
      img_cell:
        - width: 82px
        - height: 82px
        - border-radius: 24px
        - background: rgba(44, 225, 255, 0.13)
      name:
        - font-size: 14px
      state:
        - font-size: clamp(30px, 4vw, 42px)

  control_switch:
    variables:
      power_entity:
      power_search:
    show_icon: true
    show_name: true
    show_state: true
    triggers_update: all
    state_display: >-
      [[[ if (entity.state === 'on') {
            const baseEntity = entity.entity_id.replace('switch.', 'sensor.');
            const configuredEntity = variables.power_entity || `${baseEntity}_power`;
            const searchTerms = (
              Array.isArray(variables.power_search)
                ? variables.power_search
                : [variables.power_search || baseEntity.replace('sensor.', '')]
            ).map((term) => term.toLowerCase().replaceAll(' ', '_'));
            const candidates = [
              configuredEntity,
              configuredEntity.replace(/_power$/, '_puissance'),
              `${baseEntity}_power`,
              `${baseEntity}_puissance`,
              `${baseEntity}_consommation`,
              `${baseEntity}_current_consumption`
            ];
            const discoveredPowerSensors = Object.values(states)
              .filter((source) => {
                if (!source.entity_id.startsWith('sensor.')) return false;
                const unit = source.attributes.unit_of_measurement;
                const isPower = source.attributes.device_class === 'power' || unit === 'W';
                if (!isPower) return false;
                const searchableName = [
                  source.entity_id,
                  source.attributes.friendly_name || ''
                ].join('_').toLowerCase().replaceAll(' ', '_');
                return searchTerms.some((term) => searchableName.includes(term));
              });
            const powerSources = [
              ...candidates.map((entityId) => states[entityId]),
              ...discoveredPowerSensors
            ]
              .filter((candidate) => candidate);
            const powerAttributes = [
              'power',
              'current_power',
              'current_consumption',
              'power_consumption',
              'load_power'
            ];
            const externalPower = powerSources
              .map((source) => {
                const attribute = powerAttributes.find((attributeName) =>
                  source.attributes[attributeName] !== undefined &&
                  source.attributes[attributeName] !== null
                );
                if (attribute) {
                  return {
                    value: source.attributes[attribute],
                    unit:
                      source.attributes.power_unit ||
                      source.attributes.unit_of_measurement ||
                      'W'
                  };
                }
                if (
                  source.entity_id &&
                  source.entity_id.startsWith('sensor.') &&
                  !['unknown', 'unavailable'].includes(source.state)
                ) {
                  return {
                    value: source.state,
                    unit: source.attributes.unit_of_measurement || 'W'
                  };
                }
                return null;
              })
              .find((source) => source);
            const powerAttribute = powerAttributes.find((attribute) =>
              entity.attributes[attribute] !== undefined &&
              entity.attributes[attribute] !== null
            );
            const value = externalPower
              ? `${externalPower.value} ${externalPower.unit}`
              : powerAttribute
                ? `${entity.attributes[powerAttribute]} ${entity.attributes.power_unit || 'W'}`
                : '— W';
            return `Allumé · ${value}`;
          }
          if (entity.state === 'off') return 'Arrêté';
          if (entity.state === 'unavailable') return 'Indisponible';
          return entity.state; ]]]
    tap_action:
      action: toggle
    hold_action:
      action: more-info
    double_tap_action:
      action: none
    styles:
      card:
        - background: rgba(4, 18, 38, 0.76)
        - border: 1px solid rgba(44, 225, 255, 0.22)
        - border-radius: 22px
        - box-shadow: 0 12px 32px rgba(0, 0, 0, 0.28)
        - backdrop-filter: blur(14px)
        - -webkit-backdrop-filter: blur(14px)
        - min-height: 142px
        - padding: 20px
      grid:
        - grid-template-areas: '"i" "n" "s"'
        - grid-template-columns: 1fr
        - grid-template-rows: 54px min-content min-content
        - row-gap: 7px
      icon:
        - width: 38px
        - color: rgba(255, 255, 255, 0.42)
      img_cell:
        - justify-self: start
        - width: 54px
        - height: 54px
        - border-radius: 16px
        - background: rgba(255, 255, 255, 0.05)
        - border: 1px solid rgba(255, 255, 255, 0.08)
      name:
        - justify-self: start
        - color: rgba(255, 255, 255, 0.84)
        - font-size: 15px
        - font-weight: 650
      state:
        - justify-self: start
        - color: rgba(255, 255, 255, 0.42)
        - font-size: 12px
        - font-weight: 700
        - letter-spacing: 0.05em
        - text-transform: uppercase
    state:
      - value: 'on'
        styles:
          card:
            - background: linear-gradient(145deg, rgba(5, 50, 65, 0.88), rgba(3, 24, 44, 0.82))
            - border: 1px solid rgba(49, 255, 190, 0.62)
            - box-shadow: 0 12px 34px rgba(0, 0, 0, 0.3), 0 0 24px rgba(44, 225, 255, 0.13)
          icon:
            - color: '#31ffbe'
            - filter: drop-shadow(0 0 10px rgba(49, 255, 190, 0.62))
          img_cell:
            - background: rgba(49, 255, 190, 0.12)
            - border: 1px solid rgba(49, 255, 190, 0.32)
          state:
            - color: '#31ffbe'
      - value: unavailable
        styles:
          card:
            - border: 1px solid rgba(255, 77, 109, 0.62)
          icon:
            - color: '#ff4d6d'
          img_cell:
            - background: rgba(255, 77, 109, 0.1)
            - border: 1px solid rgba(255, 77, 109, 0.28)
          state:
            - color: '#ff4d6d'

  speaker_card:
    show_icon: true
    show_name: true
    show_state: true
    triggers_update:
      - entity
    tap_action:
      action: call-service
      service: script.toggle_speaker
      data:
        entity_id: '[[[ return entity.entity_id; ]]]'
    hold_action:
      action: more-info
    state_display: >-
      [[[
        if (entity.state === 'unavailable') return 'En veille';
        const vol = entity.attributes.volume_level !== undefined ? Math.round(entity.attributes.volume_level * 100) + '%' : '';
        if (entity.state === 'playing') {
          const t = entity.attributes.media_title ? ` · ${entity.attributes.media_title}` : '';
          return `Lecture · ${vol}${t}`;
        }
        if (entity.state === 'paused') {
          const t = entity.attributes.media_title ? ` · ${entity.attributes.media_title}` : '';
          return `Pause · ${vol}${t}`;
        }
        return `Inactif · ${vol}`;
      ]]]
    styles:
      card:
        - min-height: 146px
        - padding: 18px
        - cursor: pointer
        - transition: all 0.3s ease
        - background: >-
            [[[
              if (entity.state === 'playing')
                return 'linear-gradient(135deg, rgba(6, 78, 59, 0.95), rgba(16, 185, 129, 0.82))';
              if (entity.state === 'unavailable')
                return 'rgba(20, 24, 30, 0.6)';
              return 'rgba(28, 33, 44, 0.82)';
            ]]]
        - border: >-
            [[[
              if (entity.state === 'playing') return '1.5px solid #31ffbe';
              if (entity.state === 'unavailable') return '1px solid rgba(120, 144, 156, 0.15)';
              return '1px solid rgba(120, 144, 156, 0.35)';
            ]]]
        - border-radius: 22px
        - box-shadow: >-
            [[[
              if (entity.state === 'playing')
                return '0 12px 34px rgba(0, 0, 0, 0.3), 0 0 24px rgba(49, 255, 190, 0.35)';
              return '0 12px 32px rgba(0, 0, 0, 0.28)';
            ]]]
        - backdrop-filter: blur(14px)
        - -webkit-backdrop-filter: blur(14px)
      grid:
        - grid-template-areas: '"i n" "i s" "c c"'
        - grid-template-columns: 56px 1fr
        - grid-template-rows: min-content min-content 1fr
        - column-gap: 14px
        - row-gap: 8px
      icon:
        - width: 34px
        - color: >-
            [[[
              if (entity.state === 'playing') return '#31ffbe';
              if (entity.state === 'unavailable') return '#557386';
              return '#8fa3af';
            ]]]
        - filter: >-
            [[[
              if (entity.state === 'playing') return 'drop-shadow(0 0 10px rgba(49, 255, 190, 0.8))';
              return 'none';
            ]]]
      img_cell:
        - width: 56px
        - height: 56px
        - border-radius: 16px
        - background: >-
            [[[
              if (entity.state === 'playing') return 'rgba(49, 255, 190, 0.2)';
              if (entity.state === 'unavailable') return 'rgba(255, 255, 255, 0.02)';
              return 'rgba(255, 255, 255, 0.06)';
            ]]]
        - border: >-
            [[[
              if (entity.state === 'playing') return '1px solid rgba(49, 255, 190, 0.45)';
              return '1px solid rgba(255, 255, 255, 0.12)';
            ]]]
      name:
        - justify-self: start
        - color: >-
            [[[
              if (entity.state === 'playing') return '#ffffff';
              if (entity.state === 'unavailable') return 'rgba(255, 255, 255, 0.45)';
              return '#e2e8f0';
            ]]]
        - font-size: 15px
        - font-weight: 700
      state:
        - justify-self: start
        - font-size: 13px
        - font-weight: 600
        - color: >-
            [[[
              if (entity.state === 'playing') return '#31ffbe';
              if (entity.state === 'unavailable') return '#8fb6cc';
              return 'rgba(255, 255, 255, 0.6)';
            ]]]
        - white-space: nowrap
        - overflow: hidden
        - text-overflow: ellipsis
        - max-width: 100%
      custom_fields:
        c:
          - align-self: end
          - width: 100%
    custom_fields:
        c:
          - align-self: end
          - width: 100%
    custom_fields:
      c:
        card:
          type: horizontal-stack
          cards:
            - type: custom:button-card
              icon: mdi:volume-minus
              tap_action:
                action: call-service
                service: media_player.volume_down
                target:
                  entity_id: '[[[ return entity.entity_id; ]]]'
              styles:
                card:
                  - background: rgba(255, 255, 255, 0.06)
                  - border: 1px solid rgba(255, 255, 255, 0.1)
                  - border-radius: 12px
                  - height: 38px
                  - padding: 0
                  - box-shadow: none
                icon:
                  - width: 20px
                  - color: '#e6f7ff'
            - type: custom:button-card
              icon: >-
                [[[
                  return entity.state === 'playing' ? 'mdi:pause' : 'mdi:play';
                ]]]
              tap_action:
                action: call-service
                service: media_player.media_play_pause
                target:
                  entity_id: '[[[ return entity.entity_id; ]]]'
              styles:
                card:
                  - background: >-
                      [[[
                        return entity.state === 'playing' ? 'rgba(49, 255, 190, 0.22)' : 'rgba(44, 225, 255, 0.16)';
                      ]]]
                  - border: >-
                      [[[
                        return entity.state === 'playing' ? '1px solid rgba(49, 255, 190, 0.4)' : '1px solid rgba(44, 225, 255, 0.3)';
                      ]]]
                  - border-radius: 12px
                  - height: 38px
                  - padding: 0
                  - box-shadow: none
                icon:
                  - width: 22px
                  - color: >-
                      [[[
                        return entity.state === 'playing' ? '#31ffbe' : '#2ce1ff';
                      ]]]
            - type: custom:button-card
              icon: mdi:volume-plus
              tap_action:
                action: call-service
                service: media_player.volume_up
                target:
                  entity_id: '[[[ return entity.entity_id; ]]]'
              styles:
                card:
                  - background: rgba(255, 255, 255, 0.06)
                  - border: 1px solid rgba(255, 255, 255, 0.1)
                  - border-radius: 12px
                  - height: 38px
                  - padding: 0
                  - box-shadow: none
                icon:
                  - width: 20px
                  - color: '#e6f7ff'
            - type: custom:button-card
              icon: mdi:skip-next
              tap_action:
                action: call-service
                service: media_player.media_next_track
                target:
                  entity_id: '[[[ return entity.entity_id; ]]]'
              styles:
                card:
                  - background: rgba(255, 255, 255, 0.06)
                  - border: 1px solid rgba(255, 255, 255, 0.1)
                  - border-radius: 12px
                  - height: 38px
                  - padding: 0
                  - box-shadow: none
                icon:
                  - width: 20px
                  - color: '#e6f7ff'


