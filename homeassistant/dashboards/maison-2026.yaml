            custom_fields:
              content: |
                [[[ const reach=states['sensor.parking_mg_mg5_electric_reachability']; const online=reach&&!['unknown','unavailable','offline'].includes(reach.state); const updated=states['sensor.parking_mg_mg5_electric_last_update_time']; return `<div class="hero-title">MG5 LUXURY GRANDE AUTONOMIE 61 kWh</div><div class="link"><i class="${online?'on':'off'}"></i>${online?'Connectée':reach?.state||'Indisponible'}ã  —ã  Bluetoothã  —ã  4Gã  —ã  <ha-icon icon="mdi:lock"></ha-icon></div><div class="car"><img src="/local/mg5/mg5-car.png" alt="MG5"><div class="platform"></div></div><div class="updated">Dernière synchronisation : ${updated?.state||'—'}</div>`; ]]]
            extra_styles: |
              .hero-title{color:#67e8f9;font-size:17px;letter-spacing:.03em;padding:2px 12px 6px;border-bottom:1px solid rgba(56,189,248,.5)}.link{color:#8bead6;font-size:10px;margin-top:4px}.link i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px}.link i.on{background:#4ade80;box-shadow:0 0 8px #4ade80}.link i.off{background:#fb7185}.link ha-icon{width:13px}.car{height:285px;position:relative}.car img{position:relative;z-index:2;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 18px 13px rgba(0,0,0,.8))}.platform{position:absolute;z-index:1;left:14%;right:14%;bottom:6%;height:18%;border-radius:50%;border:2px solid #0ea5e9;box-shadow:0 0 12px #0284c7,inset 0 0 22px #2563eb;transform:perspective(220px) rotateX(68deg)}.updated{font-size:9px;color:#7899ac;text-align:right}

